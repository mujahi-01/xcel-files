name: xcel
description: XCEL - Directory Rename Tool with Firebase Auth
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

  # Local storage
  shared_preferences: ^2.3.2

  # Background tasks (auto turn-off after 4 hours)
  workmanager: ^0.5.2

  # Device identification for one-device-per-user
  device_info_plus: ^11.1.1

  # Storage permissions
  permission_handler: ^11.3.1

  # External links
  url_launcher: ^6.3.1

  # Date formatting
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
